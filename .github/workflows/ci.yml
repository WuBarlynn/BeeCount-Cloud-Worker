name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Build web console
        run: |
          cd frontend
          pnpm install --frozen-lockfile
          cd apps/web
          pnpm build
      - name: Worker bundle check
        run: npx wrangler deploy --dry-run
